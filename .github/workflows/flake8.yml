
name: Qualidade de Código - Flake8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Verificar código Python
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flake8 e plugin Pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 flake8-pytest-style

      - name: Executar análise estática
        run: python -m flake8 .
